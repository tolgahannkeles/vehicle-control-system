<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>İKA GÖREV KONTROL MERKEZİ (GCS)</title>
<style>
  :root {
    --bg-dark: #0b0f17;
    --card-bg: rgba(22, 30, 44, 0.85);
    --border-color: #243247;
    --accent-blue: #00b4d8;
    --accent-green: #06d6a0;
    --accent-red: #ef476f;
    --accent-yellow: #ffd166;
    --text-primary: #e2e8f0;
    --text-dim: #94a3b8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 15px;
    background: radial-gradient(circle at 50% 20%, #162235 0%, var(--bg-dark) 80%);
    color: var(--text-primary);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, monospace;
    user-select: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%; max-width: 1300px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 10px; margin-bottom: 15px;
  }
  .title-box { display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: 2px; color: var(--accent-blue); text-transform: uppercase; }
  .sys-badge { font-size: 0.75rem; background: #1e293b; color: var(--accent-green); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--accent-green); }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 15px;
    width: 100%;
    max-width: 1300px;
  }

  @media (max-width: 950px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }

  .card-hdr {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent-blue);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
    text-transform: uppercase;
  }

  /* HUD & Video Stream */
  .viewport-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cameraStream {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hud-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    border: 1px solid rgba(0, 180, 216, 0.2);
  }
  .hud-reticle {
    position: absolute; top: 50%; left: 50%;
    width: 40px; height: 40px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0, 180, 216, 0.5);
    border-radius: 50%;
  }
  .hud-reticle::before, .hud-reticle::after {
    content: ''; position: absolute; background: rgba(0, 180, 216, 0.7);
  }
  .hud-reticle::before { top: 50%; left: -10px; width: 60px; height: 1px; transform: translateY(-50%); }
  .hud-reticle::after { top: -10px; left: 50%; width: 1px; height: 60px; transform: translateX(-50%); }

  .hud-tag {
    position: absolute;
    font-size: 0.7rem; font-family: monospace;
    color: var(--accent-green);
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .cam-config {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    font-size: 0.8rem;
  }
  .cam-input {
    background: #0f172a;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 5px 10px;
    border-radius: 4px;
    flex-grow: 1;
  }

  /* Telemetri */
  .telemetry-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    text-align: center;
    margin-bottom: 15px;
  }
  .telem-box {
    background: #0f172a;
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 6px;
  }
  .telem-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
  .telem-val { font-size: 1.3rem; font-weight: bold; color: var(--accent-green); margin-top: 4px; font-family: monospace; }

  /* Kontroller */
  .ctrl-box {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 10px 0;
    touch-action: none;
  }
  .slider-container { display: flex; flex-direction: column; align-items: center; }
  .slider-lbl { font-size: 0.75rem; margin-bottom: 6px; color: var(--text-dim); }

  .vertical-slider {
    -webkit-appearance: none;
    width: 140px; height: 12px;
    border-radius: 6px; background: #0f172a;
    transform: rotate(-90deg);
    margin: 45px 0; outline: none;
    border: 1px solid var(--border-color);
  }
  .vertical-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-green); cursor: pointer;
    box-shadow: 0 0 10px rgba(6,214,160,0.6);
  }

  #stick {
    width: 160px; height: 160px;
    background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
    border-radius: 50%; position: relative;
    border: 2px solid var(--border-color);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
  }
  #knob {
    width: 54px; height: 54px;
    background: var(--accent-blue);
    border-radius: 50%; position: absolute;
    box-shadow: 0 0 15px rgba(0,180,216,0.8);
    pointer-events: none;
  }

  .stop-btn {
    width: 100%; height: 46px;
    background: var(--accent-red);
    color: #fff; border: none; border-radius: 6px;
    font-weight: bold; font-size: 1rem; cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(239,71,111,0.4);
    margin-top: 10px;
  }
  .stop-btn:active { background: #b71c1c; transform: scale(0.99); }

  .status {
    font-size: 0.8rem; color: var(--text-dim);
    margin-top: 10px; text-align: center;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .disabled-overlay { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

  /* OTA */
  .ota-box { border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px; text-align: center; }
  .ota-box input[type=file] { display: none; }
  .ota-btn {
    background: #0f172a; border: 1px solid var(--accent-blue);
    color: var(--accent-blue); padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    display: inline-block;
  }
  .ota-btn:hover { background: var(--accent-blue); color: #000; }
  .progress-bar { width: 100%; height: 5px; background: #0f172a; border-radius: 3px; margin-top: 8px; overflow: hidden; display: none; }
  .progress-fill { width: 0%; height: 100%; background: var(--accent-green); transition: width 0.2s; }
</style>
</head>
<body>

<header>
  <div class="title-box">
    <h1>İKA Görev Kontrol</h1>
    <span class="sys-badge">CANLI TELEMETRİ</span>
  </div>
  <div id="clock" style="font-family:monospace; color:var(--text-dim); font-size:0.85rem;">00:00:00 UTC</div>
</header>

<div class="dashboard-grid">
  <!-- SOL BÖLGE: FPV VİDEO AKIŞI VE HUD -->
  <div class="card">
    <div class="card-hdr">
      <span>FPV Canlı Kamera Yayını (Raspberry Pi)</span>
      <span id="camStatus" style="color:var(--accent-green);">ONLINE</span>
    </div>

    <div class="viewport-container">
      <img id="cameraStream" src="http://192.168.1.155:8080/video_feed" alt="Kamera Akışı Bekleniyor..." onerror="camError()">
      
      <!-- HUD Çizgileri -->
      <div class="hud-overlay">
        <div class="hud-reticle"></div>
        <div class="hud-tag" style="top:10px; left:10px;">CAM-01 [RAW MJPEG]</div>
        <div class="hud-tag" style="bottom:10px; left:10px;" id="hudSpeed">SPD: %0</div>
        <div class="hud-tag" style="bottom:10px; right:10px;" id="hudSteer">STR: %0</div>
      </div>
    </div>

    <!-- Kamera IP Değiştirici -->
    <div class="cam-config">
      <input type="text" class="cam-input" id="camUrl" value="http://192.168.1.155:8080/video_feed">
      <button class="ota-btn" onclick="updateCamStream()">Akışı Yenile</button>
    </div>
  </div>

  <!-- SAĞ BÖLGE: TELEMETRİ VE SÜRÜŞ KONTROLLERİ -->
  <div style="display:flex; flex-direction:column; gap:15px;">
    
    <div class="card" id="c1">
      <div class="card-hdr">Sistem Telemetrisi</div>
      <div class="telemetry-grid">
        <div class="telem-box">
          <div class="telem-label">Gaz / Hız</div>
          <div class="telem-val" id="tVal">%0</div>
        </div>
        <div class="telem-box">
          <div class="telem-label">Direksiyon</div>
          <div class="telem-val" id="sVal">%0</div>
        </div>
        <div class="telem-box">
          <div class="telem-label">Güç Limiti</div>
          <div class="telem-val" id="pVal">%80</div>
        </div>
      </div>

      <div class="slider-container" style="width:100%;">
        <div class="slider-lbl">HIZ LİMİTİ ÇARPANI</div>
        <input type="range" min="100" max="1000" value="800" style="width:90%; accent-color:var(--accent-blue);" id="powerSlider">
      </div>
    </div>

    <div class="card" id="c2">
      <div class="card-hdr">Sürüş Konsolu</div>
      <div class="ctrl-box">
        <div class="slider-container">
          <div class="slider-lbl">DİKEY GAZ</div>
          <input type="range" min="-1000" max="1000" value="0" class="vertical-slider" id="throttleSlider">
        </div>
        <div>
          <div class="slider-lbl" style="text-align:center;">2-EKSEN DİREKSİYON</div>
          <div id="stick"><div id="knob"></div></div>
        </div>
      </div>

      <button class="stop-btn" onclick="emergencyStop()">ACİL FREN (E-STOP)</button>
      <div class="status" id="wsStat">BAĞLANTI BEKLENİYOR...</div>

      <!-- OTA Kutusu -->
      <div class="ota-box">
        <input type="file" id="otaFile" accept=".bin" onchange="uploadFirmware()">
        <label for="otaFile" class="ota-btn" id="otaBtnLabel">Firmware Yükle (.bin)</label>
        <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
        <div id="otaStatus" style="font-size:0.75rem; color:var(--text-dim); margin-top:4px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
// Saat
setInterval(function() {
  var d = new Date();
  document.getElementById('clock').innerText = d.toTimeString().split(' ')[0] + " LOC";
}, 1000);

// Kamera Akışı Yönetimi
function updateCamStream() {
  var url = document.getElementById('camUrl').value;
  var stream = document.getElementById('cameraStream');
  stream.src = url + "?t=" + Date.now();
  document.getElementById('camStatus').innerText = "ONLINE";
  document.getElementById('camStatus').style.color = "var(--accent-green)";
}

function camError() {
  document.getElementById('camStatus').innerText = "OFFLINE";
  document.getElementById('camStatus').style.color = "var(--accent-red)";
}

// Telemetri ve WS İletişimi
var ws = null, throttle = 0, steer = 0, maxPower = 0.8, isControlOwner = false;
var myToken = "C_" + Math.floor(Math.random() * 899999 + 100000);

var tVal = document.getElementById('tVal'), sVal = document.getElementById('sVal'), pVal = document.getElementById('pVal');
var wsStat = document.getElementById('wsStat'), throttleSlider = document.getElementById('throttleSlider'), powerSlider = document.getElementById('powerSlider');
var c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
var hudSpeed = document.getElementById('hudSpeed'), hudSteer = document.getElementById('hudSteer');

function connectWS() {
  var host = window.location.host || "192.168.1.151";
  ws = new WebSocket("ws://" + host + "/ws");
  
  ws.onopen = function() {
    wsStat.innerText = "CANLI TELEMETRİ AKTİF";
    wsStat.style.color = "var(--accent-blue)";
  };
  
  ws.onmessage = function(e) {
    if (e.data === "GRANTED") {
      if (!isControlOwner) {
        isControlOwner = true;
        c1.classList.remove("disabled-overlay");
        c2.classList.remove("disabled-overlay");
        wsStat.innerText = "KONTROL SİSTEMDE (AKTİF)";
        wsStat.style.color = "var(--accent-green)";
      }
    } else if (e.data === "LOCKED") {
      isControlOwner = false;
      c1.classList.add("disabled-overlay");
      c2.classList.add("disabled-overlay");
      wsStat.innerText = "KİLİTLİ: BAŞKA İSTASYON BAĞLI";
      wsStat.style.color = "var(--accent-red)";
    }
  };
  
  ws.onerror = function() {
    wsStat.innerText = "BAĞLANTI HATASI!";
    wsStat.style.color = "var(--accent-red)";
  };
  
  ws.onclose = function() {
    wsStat.innerText = "KOPTU! YENİDEN BAĞLANIYOR...";
    wsStat.style.color = "var(--accent-red)";
    setTimeout(connectWS, 1500);
  };
}
connectWS();

function sendControl() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    var finalT = Math.round(throttle * maxPower);
    var finalS = Math.round(steer * maxPower);
    ws.send(myToken + ";" + finalT + "," + finalS);
    if (isControlOwner) {
      var pctT = Math.round(finalT / 10);
      var pctS = Math.round(finalS / 10);
      tVal.innerText = "%" + pctT;
      sVal.innerText = "%" + pctS;
      hudSpeed.innerText = "SPD: %" + pctT;
      hudSteer.innerText = "STR: %" + pctS;
    }
  }
}

// Slider İşlemleri
throttleSlider.addEventListener('input', function(e) { 
  throttle = parseInt(e.target.value); 
  sendControl(); 
});
function resetThrottle() { 
  throttleSlider.value = 0; 
  throttle = 0; 
  sendControl(); 
}
throttleSlider.addEventListener('touchend', resetThrottle);
throttleSlider.addEventListener('mouseup', resetThrottle);

powerSlider.addEventListener('input', function(e) {
  maxPower = parseInt(e.target.value) / 1000;
  pVal.innerText = "%" + Math.round(maxPower * 100);
  sendControl();
});

// Joystick
var stick = document.getElementById('stick'), knob = document.getElementById('knob'), dragging = false;

function handleMove(clientX, clientY) {
  if (!isControlOwner && ws && ws.readyState === WebSocket.OPEN) return;
  var rect = stick.getBoundingClientRect();
  var dx = clientX - (rect.left + rect.width / 2);
  var dy = clientY - (rect.top + rect.height / 2);
  var dist = Math.min(50, Math.hypot(dx, dy));
  var angle = Math.atan2(dy, dx);
  
  var kx = dist * Math.cos(angle);
  var ky = dist * Math.sin(angle);
  knob.style.transform = "translate(" + kx + "px, " + ky + "px)";
  
  steer = Math.round((kx / 50) * 1000);
  throttle = Math.round((-ky / 50) * 1000);
  throttleSlider.value = throttle;
  
  sendControl();
}

stick.addEventListener('pointerdown', function(e) { dragging = true; handleMove(e.clientX, e.clientY); });
window.addEventListener('pointermove', function(e) { if(dragging) handleMove(e.clientX, e.clientY); });
window.addEventListener('pointerup', function() {
  if (dragging) {
    dragging = false;
    knob.style.transform = "translate(0px, 0px)";
    steer = 0;
    throttle = 0;
    throttleSlider.value = 0;
    sendControl();
  }
});

function emergencyStop() {
  resetThrottle();
  steer = 0;
  throttle = 0;
  knob.style.transform = "translate(0px, 0px)";
  sendControl();
}
setInterval(sendControl, 80);

// OTA Güncelleme
function uploadFirmware() {
  var fileInput = document.getElementById('otaFile');
  if (fileInput.files.length === 0) return;

  var file = fileInput.files[0];
  var xhr = new XMLHttpRequest();
  var pBar = document.getElementById('pBar');
  var pFill = document.getElementById('pFill');
  var otaStatus = document.getElementById('otaStatus');
  var otaBtnLabel = document.getElementById('otaBtnLabel');

  pBar.style.display = 'block';
  otaBtnLabel.style.display = 'none';
  otaStatus.innerText = "Yükleniyor: %0";

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      var percent = Math.round((e.loaded / e.total) * 100);
      pFill.style.width = percent + '%';
      otaStatus.innerText = percent < 100 ? "Yükleniyor: %" + percent : "Flash belleğe yazılıyor...";
    }
  };

  xhr.onload = function() {
    if (xhr.status === 200) {
      otaStatus.innerText = "Yükleme Başarılı! Cihaz yeniden başlatılıyor...";
      otaStatus.style.color = "var(--accent-green)";
      setTimeout(function() { window.location.reload(); }, 6000);
    } else {
      otaStatus.innerText = "Hata! Kod: " + xhr.status;
      otaStatus.style.color = "var(--accent-red)";
      otaBtnLabel.style.display = 'inline-block';
    }
  };

  xhr.open("POST", "/update", true);
  xhr.send(file);
}
</script>
</body>
</html>
